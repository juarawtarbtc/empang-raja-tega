<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>🐟 Empang Raja Tega | Arena Skill & Hoki</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* LATAR BELAKANG FULL COVER (MENUTUP SEMUA LAYAR) */
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, 'Roboto', sans-serif;
      min-height: 100vh;
      background-image: url('empang raja tega.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
      background-attachment: fixed;
      background-color: #0a2f1a;
      position: relative;
    }

    /* Overlay gelap agar konten lebih kontras */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(2px);
      z-index: -1;
    }

    #loginScreen, #appMain {
      position: relative;
      z-index: 2;
    }

    /* Halaman login */
    #loginScreen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background: transparent;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(2px);
      border-radius: 32px;
      padding: 32px 28px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(232, 168, 23, 0.3);
      text-align: center;
      border: 1px solid rgba(232, 168, 23, 0.5);
    }

    .login-card h2 {
      color: #0a4628;
      margin-bottom: 24px;
      font-size: 1.9rem;
      font-weight: 800;
    }

    .login-card input {
      width: 100%;
      padding: 14px 16px;
      margin: 12px 0;
      border: 2px solid #dde6dd;
      border-radius: 40px;
      font-size: 1rem;
      background: #ffffff;
      transition: 0.2s;
    }

    .login-card input:focus {
      border-color: #e8a817;
      outline: none;
      box-shadow: 0 0 0 3px rgba(232, 168, 23, 0.2);
    }

    .login-card button {
      width: 100%;
      padding: 14px;
      background: #e8a817;
      border: none;
      border-radius: 60px;
      font-weight: 800;
      font-size: 1.1rem;
      color: #2c2400;
      cursor: pointer;
      margin-top: 12px;
      transition: 0.2s;
    }

    .login-card button:hover {
      background: #d49610;
      transform: scale(0.98);
    }

    .login-error {
      color: #e67e22;
      font-weight: 600;
      margin-top: 12px;
    }

    /* APP MAIN */
    #appMain {
      min-height: 100vh;
      background: transparent;
      display: none;
    }

    .header {
      background: rgba(13, 79, 43, 0.92);
      backdrop-filter: blur(12px);
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
      border-bottom: 2px solid #e8a817;
    }

    .header .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.4rem;
      font-weight: 800;
    }

    .header button {
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 215, 0, 0.5);
      color: #ffefb9;
      padding: 8px 18px;
      border-radius: 40px;
      font-weight: 700;
      cursor: pointer;
    }

    .dashboard {
      padding: 28px 20px;
      display: block;
    }

    .icon-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 460px;
      margin: 0 auto;
    }

    .icon-item {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(4px);
      border-radius: 28px;
      padding: 20px 8px;
      text-align: center;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(232, 168, 23, 0.6);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-item:active {
      transform: scale(0.96);
    }

    .icon-item .emoji {
      font-size: 2.8rem;
      display: block;
      margin-bottom: 10px;
    }

    .icon-item .label {
      font-weight: 700;
      font-size: 0.9rem;
      color: #1a5a38;
    }

    .panel {
      display: none;
      padding: 18px;
      padding-bottom: 40px;
    }

    .panel.active {
      display: block;
    }

    .card {
      background: white;
      border-radius: 28px;
      padding: 22px 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      border: 1px solid #e2eedb;
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .back-btn {
      background: rgba(255,255,240,0.9);
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      color: #0f5c37;
      width: 44px;
      height: 44px;
      border-radius: 60px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: none;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      background: white;
      color: #1a6b3c;
      border: 2px solid #1a6b3c;
    }

    .btn-primary {
      background: #1a6b3c;
      color: white;
      border: none;
    }

    .btn-accent {
      background: #e8a817;
      color: #2c2400;
      border: none;
    }

    .btn-danger {
      background: #c0392b;
      color: white;
      border: none;
    }

    .btn-sm {
      padding: 6px 16px;
      font-size: 0.75rem;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 6px;
      color: #1d4933;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #d4e2d4;
      border-radius: 20px;
      font-size: 0.95rem;
      background: #fefef7;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
      min-width: 500px;
    }

    th, td {
      padding: 10px 6px;
      text-align: left;
      border-bottom: 1px solid #e0ecd9;
    }

    th {
      background: #f3f9f0;
      font-weight: 800;
      color: #1c5c39;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal {
      background: white;
      border-radius: 32px;
      padding: 24px;
      max-width: 95vw;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      border-top: 6px solid #e8a817;
    }

    .scoreboard {
      background: linear-gradient(145deg, #092719, #15462e);
      color: white;
      padding: 24px 16px;
      border-radius: 32px;
      text-align: center;
      border: 2px solid #e8a817;
    }

    .scoreboard h2 {
      color: #f5c542;
      font-size: 1.7rem;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e2a1c;
      color: #ffeaac;
      padding: 10px 22px;
      border-radius: 60px;
      z-index: 300;
      font-weight: bold;
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }

    .mode-selector {
      background: #f9fde7;
      padding: 12px 14px;
      border-radius: 40px;
      margin: 12px 0;
    }

    @media (max-width: 520px) {
      .icon-grid { gap: 12px; }
      .icon-item { padding: 14px 4px; }
      .icon-item .emoji { font-size: 2rem; }
    }
  </style>
</head>
<body>

<!-- LAYAR LOGIN (tanpa nilai default) -->
<div id="loginScreen">
  <div class="login-card">
    <h2>🐟 EMPANG RAJA TEGA</h2>
    <input type="text" id="loginId" placeholder="ID Admin">
    <input type="password" id="loginPass" placeholder="Password">
    <button onclick="doLogin()">⚡ MASUK ARENA ⚡</button>
    <div class="login-error" id="loginError"></div>
    <p style="margin-top: 16px; font-size: 0.7rem; color:#846c30;">Skill & Hoki bertemu di sini</p>
  </div>
</div>

<!-- APP UTAMA (sama seperti sebelumnya, hanya fungsi login disesuaikan) -->
<div id="appMain">
  <header class="header">
    <div class="logo"><span>🎣</span> Empang Raja Tega</div>
    <button onclick="doLogout()">🚪 KELUAR</button>
  </header>

  <div class="dashboard active" id="dashboard">
    <div class="icon-grid">
      <div class="icon-item" onclick="openModule('lomba')"><span class="emoji">📋</span><span class="label">LOMBA</span></div>
      <div class="icon-item" onclick="openModule('pendaftaran')"><span class="emoji">📝</span><span class="label">PESERTA</span></div>
      <div class="icon-item" onclick="openModule('pencatatan')"><span class="emoji">🎣</span><span class="label">CACATAN</span></div>
      <div class="icon-item" onclick="openModule('hasil')"><span class="emoji">🏆</span><span class="label">HASIL</span></div>
      <div class="icon-item" onclick="openModule('papan')"><span class="emoji">📺</span><span class="label">TV SKOR</span></div>
      <div class="icon-item" onclick="resetAllData()"><span class="emoji">🗑️</span><span class="label">RESET</span></div>
      <div class="icon-item" onclick="doLogout()"><span class="emoji">🚪</span><span class="label">LOGOUT</span></div>
    </div>
  </div>

  <!-- Panel Lomba -->
  <div class="panel" id="panel-lomba">
    <div class="panel-header"><button class="back-btn" onclick="goHome()">←</button><h2>📋 Kelola Lomba</h2></div>
    <div class="card"><button class="btn btn-primary btn-sm" onclick="showModal('modalLomba')">+ Lomba Baru</button></div>
    <div class="card"><div style="overflow-x:auto;"><table><thead><tr><th>Nama</th><th>Tipe</th><th>Tanggal</th><th>Status</th><th>Juara</th><th>Aksi</th></tr></thead><tbody id="lombaTable"></tbody></table></div></div>
  </div>

  <!-- Panel Pendaftaran -->
  <div class="panel" id="panel-pendaftaran">
    <div class="panel-header"><button class="back-btn" onclick="goHome()">←</button><h2>📝 Pendaftaran & Lapak</h2></div>
    <div class="card">
      <div class="form-group"><label>Pilih Lomba</label><select id="selDaftar" onchange="renderPeserta()"><option value="">-- Pilih --</option></select></div>
      <div class="mode-selector">
        <label><input type="radio" name="modeUndi" value="manual" checked onchange="changeModeUndi('manual')"> ✍️ Mode Manual</label>
        <label><input type="radio" name="modeUndi" value="otomatis" onchange="changeModeUndi('otomatis')"> 🎲 Mode Otomatis</label>
      </div>
      <button class="btn btn-accent btn-sm" onclick="showModal('modalPeserta')" id="btnTambahPeserta" disabled>+ Tambah Peserta</button>
      <button class="btn btn-outline btn-sm" onclick="undiOtomatis()" id="btnUndi" disabled>🎲 Undi Otomatis</button>
      <div style="overflow-x:auto;"><table id="pesertaTable"></table></div>
    </div>
  </div>

  <!-- Panel Pencatatan -->
  <div class="panel" id="panel-pencatatan">
    <div class="panel-header"><button class="back-btn" onclick="goHome()">←</button><h2>🎣 Catat Tangkapan</h2></div>
    <div class="card">
      <div class="form-group"><label>Pilih Lomba</label><select id="selCatat" onchange="renderCatatan()"><option value="">-- Pilih --</option></select></div>
      <div id="infoCatatan" style="font-weight: bold; margin-bottom: 12px;"></div>
      <div id="aksiCatatan" style="display:none; gap: 12px; flex-wrap: wrap; margin-bottom: 18px;">
        <button class="btn btn-primary btn-sm" onclick="catatSuper()">🐟 SUPER</button>
        <button class="btn btn-outline btn-sm" onclick="catatRamai()">🐠 RAMAI</button>
        <button class="btn btn-accent btn-sm" onclick="mulaiLomba()" id="btnMulai">▶️ Mulai</button>
        <button class="btn btn-danger btn-sm" onclick="selesaiLomba()" id="btnSelesai">⏹️ Selesai</button>
      </div>
      <div style="overflow-x:auto;"><table id="catatanTable"></table></div>
    </div>
  </div>

  <!-- Panel Hasil -->
  <div class="panel" id="panel-hasil">
    <div class="panel-header"><button class="back-btn" onclick="goHome()">←</button><h2>🏆 Hasil</h2></div>
    <div class="card">
      <div class="form-group"><label>Pilih Lomba</label><select id="selHasil" onchange="renderHasil()"><option value="">-- Pilih --</option></select></div>
      <div id="hasilContent"></div>
    </div>
  </div>

  <!-- Panel Papan Skor TV -->
  <div class="panel" id="panel-papan">
    <div class="panel-header"><button class="back-btn" onclick="goHome()">←</button><h2>📺 Papan Skor TV</h2></div>
    <div class="card">
      <select id="selTV" onchange="renderTV()" style="width:100%;margin-bottom:16px;"><option value="">-- Pilih Lomba --</option></select>
      <div id="tvContainer"></div>
    </div>
  </div>
</div>

<!-- MODALS (singkat) -->
<div class="modal-overlay" id="modalLomba" style="display:none;"><div class="modal"><h3 id="judulLomba">Buat Lomba</h3>
  <div class="form-group"><label>Tipe</label><select id="fTipe"><option value="gaplean">Gaplean</option><option value="sunday">Minggu</option></select></div>
  <div class="form-group"><label>Nama</label><input id="fNama"></div>
  <div class="form-group"><label>Tanggal</label><input type="date" id="fTanggal"></div>
  <div style="display:flex;gap:10px;"><div class="form-group"><label>Mulai</label><input type="time" id="fMulai" value="08:00"></div><div class="form-group"><label>Selesai</label><input type="time" id="fSelesai" value="16:00"></div></div>
  <div class="form-group"><label>Jumlah Juara</label><input type="number" id="fJuara" value="4" min="1"></div>
  <input type="hidden" id="fId"><button class="btn btn-primary" onclick="simpanLomba()">Simpan</button><button class="btn btn-outline" onclick="closeModal('modalLomba')">Batal</button></div></div>

<div class="modal-overlay" id="modalPeserta" style="display:none;"><div class="modal"><h3>Tambah/Edit Peserta</h3>
  <div class="form-group"><label>Nama</label><input id="fPNama"></div>
  <div class="form-group"><label>No HP</label><input id="fPHP"></div>
  <div class="form-group"><label>Booking</label><select id="fPBooking"><option value="lunas">Lunas</option><option value="dp">DP</option><option value="belum">Belum</option></select></div>
  <div class="form-group"><label>No Lapak (manual)</label><input type="number" id="fPLapak" min="1" max="40"></div>
  <input type="hidden" id="fPId"><button class="btn btn-primary" onclick="simpanPeserta()">Simpan</button><button class="btn btn-outline" onclick="closeModal('modalPeserta')">Batal</button></div></div>

<div class="modal-overlay" id="modalSuper" style="display:none;"><div class="modal"><h3>Ikan Super</h3>
  <div class="form-group"><label>Peserta</label><select id="fSuperPeserta"></select></div>
  <div class="form-group"><label>Berat (kg)</label><input type="number" id="fSuperBerat" step="0.01"></div>
  <button class="btn btn-primary" onclick="simpanSuper()">Catat</button><button class="btn btn-outline" onclick="closeModal('modalSuper')">Batal</button></div></div>

<div class="modal-overlay" id="modalRamai" style="display:none;"><div class="modal"><h3>Ikan Ramai</h3>
  <div class="form-group"><label>Group</label><select id="fRamaiGroup" onchange="isiPesertaGroup()"><option value="A">A</option><option value="B">B</option></select></div>
  <div class="form-group"><label>Peserta</label><select id="fRamaiPeserta"></select></div>
  <div class="form-group"><label>Jumlah</label><input type="number" id="fRamaiJumlah" value="1"></div>
  <button class="btn btn-primary" onclick="simpanRamai()">Catat</button><button class="btn btn-outline" onclick="closeModal('modalRamai')">Batal</button></div></div>

<script>
(function() {
  const STORAGE = 'empang_raja_tega2';
  const TOTAL_LAPAK = 40;
  let data = { lomba: [] };
  let currentModeUndi = 'manual';

  // LOGIN: tidak ada default, user harus input sendiri
  window.doLogin = () => {
    const id = document.getElementById('loginId').value.trim();
    const pass = document.getElementById('loginPass').value.trim();
    // Kredensial tetap rayhan / 123456 (bisa diganti sesuai keperluan)
    if(id === 'rayhan' && pass === '123456') {
      sessionStorage.setItem('empang_logged', 'true');
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appMain').style.display = 'block';
      loadData(); refreshAll();
      toast("⚡ Selamat datang!");
    } else {
      document.getElementById('loginError').textContent = 'ID atau password salah!';
    }
  };
  window.doLogout = () => { sessionStorage.removeItem('empang_logged'); location.reload(); };

  if(sessionStorage.getItem('empang_logged') === 'true') {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appMain').style.display = 'block';
    loadData(); refreshAll();
  }

  function loadData() { try { const r = localStorage.getItem(STORAGE); if(r) data = JSON.parse(r); } catch(e) { data = { lomba: [] }; } }
  function saveData() { localStorage.setItem(STORAGE, JSON.stringify(data)); }
  function getLomba(id) { return data.lomba.find(l => l.id === id); }
  function genId() { return 'lmb_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6); }
  function group(no) { return no <= 20 ? 'A' : 'B'; }
  function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2300); }
  window.showModal = (id) => document.getElementById(id).style.display = 'flex';
  window.closeModal = (id) => document.getElementById(id).style.display = 'none';

  window.openModule = (module) => {
    document.getElementById('dashboard').style.display = 'none';
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + module).classList.add('active');
    if(module === 'lomba') renderLomba();
    else if(module === 'pendaftaran') { populateSelect('selDaftar'); renderPeserta(); }
    else if(module === 'pencatatan') { populateSelect('selCatat'); renderCatatan(); }
    else if(module === 'hasil') { populateSelect('selHasil'); renderHasil(); }
    else if(module === 'papan') { populateSelect('selTV'); renderTV(); }
  };
  window.goHome = () => {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('dashboard').style.display = 'block';
  };
  window.changeModeUndi = (mode) => { currentModeUndi = mode; renderPeserta(); };

  function populateSelect(id) {
    const sel = document.getElementById(id); const v = sel.value;
    sel.innerHTML = '<option value="">-- Pilih Lomba --</option>';
    data.lomba.forEach(l => { const o = document.createElement('option'); o.value = l.id; o.textContent = `${l.nama} | ${l.tipe} | ${l.tanggal} | ${l.status}`; sel.appendChild(o); });
    if(v && data.lomba.some(l => l.id === v)) sel.value = v;
  }

  function renderLomba() {
    document.getElementById('lombaTable').innerHTML = data.lomba.map(l => `<tr><td>${l.nama}</td><td>${l.tipe}</td><td>${l.tanggal}</td><td>${l.status}</td><td>${l.jmlJuara}</td><td><button class="btn btn-sm" onclick="editLomba('${l.id}')">✏️</button></td></tr>`).join('');
  }
  window.editLomba = (id) => { const l = getLomba(id); if(!l) return; document.getElementById('fId').value=l.id; document.getElementById('fTipe').value=l.tipe; document.getElementById('fNama').value=l.nama; document.getElementById('fTanggal').value=l.tanggal; document.getElementById('fMulai').value=l.jamMulai; document.getElementById('fSelesai').value=l.jamSelesai; document.getElementById('fJuara').value=l.jmlJuara; showModal('modalLomba'); };
  window.simpanLomba = () => {
    const id = document.getElementById('fId').value;
    const obj = { id: id || genId(), tipe: document.getElementById('fTipe').value, nama: document.getElementById('fNama').value.trim(), tanggal: document.getElementById('fTanggal').value, jamMulai: document.getElementById('fMulai').value, jamSelesai: document.getElementById('fSelesai').value, totalLapak: TOTAL_LAPAK, jmlJuara: parseInt(document.getElementById('fJuara').value)||4, status: 'upcoming', actualStart: null, actualEnd: null, peserta: [], catatan: [] };
    if(id) { const idx = data.lomba.findIndex(l=>l.id===id); if(idx!==-1) { obj.peserta = data.lomba[idx].peserta; obj.catatan = data.lomba[idx].catatan; obj.status = data.lomba[idx].status; data.lomba[idx] = obj; } } else data.lomba.push(obj);
    saveData(); closeModal('modalLomba'); toast('Lomba tersimpan'); renderLomba(); ['selDaftar','selCatat','selHasil','selTV'].forEach(populateSelect);
  };

  function renderPeserta() {
    const lomba = getLomba(document.getElementById('selDaftar').value);
    const btnTambah = document.getElementById('btnTambahPeserta'), btnUndi = document.getElementById('btnUndi');
    if(!lomba) { document.getElementById('pesertaTable').innerHTML=''; btnTambah.disabled=true; btnUndi.disabled=true; return; }
    btnTambah.disabled = lomba.status !== 'upcoming';
    btnUndi.disabled = !(currentModeUndi === 'otomatis' && lomba.status === 'upcoming');
    const isReadonly = (currentModeUndi === 'otomatis');
    document.getElementById('pesertaTable').innerHTML = (lomba.peserta||[]).map((p,i)=>`<tr><td>${i+1}</td><td>${p.nama}</td><td>${p.hp||'-'}</td><td><input type="number" value="${p.noLapak||''}" min="1" max="40" style="width:65px" onchange="updateNoLapak('${lomba.id}','${p.id}',this.value)" ${isReadonly ? 'readonly' : ''}></td><td>${p.noLapak?group(p.noLapak):'-'}</td><td>${p.booking}</td><td><button class="btn btn-sm" onclick="editPeserta('${lomba.id}','${p.id}')">✏️</button></td></tr>`).join('');
  }
  window.updateNoLapak = (lombaId, pesertaId, val) => { if(currentModeUndi === 'otomatis') { toast('Mode otomatis aktif!'); renderPeserta(); return; } const lomba = getLomba(lombaId); if(!lomba) return; const p = lomba.peserta.find(p=>p.id===pesertaId); if(!p) return; const no = parseInt(val); if(isNaN(no)||no<1||no>TOTAL_LAPAK) { toast('Lapak 1-40'); renderPeserta(); return; } p.noLapak = no; saveData(); renderPeserta(); };
  window.editPeserta = (lombaId, pId) => { const lomba = getLomba(lombaId); if(!lomba) return; const p = lomba.peserta.find(p=>p.id===pId); if(!p) return; document.getElementById('fPId').value=p.id; document.getElementById('fPNama').value=p.nama; document.getElementById('fPHP').value=p.hp||''; document.getElementById('fPBooking').value=p.booking; document.getElementById('fPLapak').value=p.noLapak||''; showModal('modalPeserta'); };
  window.simpanPeserta = () => { const lomba = getLomba(document.getElementById('selDaftar').value); if(!lomba) return; const pId = document.getElementById('fPId').value; const lapakManual = parseInt(document.getElementById('fPLapak').value) || null; const peserta = { id: pId || 'pst_'+Date.now(), nama: document.getElementById('fPNama').value.trim(), hp: document.getElementById('fPHP').value, booking: document.getElementById('fPBooking').value, noLapak: lapakManual }; if(pId) { const idx = lomba.peserta.findIndex(p=>p.id===pId); if(idx!==-1) lomba.peserta[idx]=peserta; } else lomba.peserta.push(peserta); saveData(); closeModal('modalPeserta'); renderPeserta(); };
  window.undiOtomatis = () => { if(currentModeUndi !== 'otomatis') { toast('Aktifkan mode Otomatis'); return; } const lomba = getLomba(document.getElementById('selDaftar').value); if(!lomba || lomba.status !== 'upcoming') return; const spots = Array.from({length:TOTAL_LAPAK},(_,i)=>i+1).sort(()=>Math.random()-0.5); lomba.peserta.forEach((p,i)=> p.noLapak = spots[i]); saveData(); renderPeserta(); toast('Undian selesai'); };
  
  function renderCatatan() {
    const lomba = getLomba(document.getElementById('selCatat').value);
    const aksiDiv = document.getElementById('aksiCatatan');
    if(lomba) { aksiDiv.style.display = 'flex'; document.getElementById('btnMulai').style.display = lomba.status==='upcoming'?'inline-flex':'none'; document.getElementById('btnSelesai').style.display = lomba.status==='active'?'inline-flex':'none'; document.getElementById('infoCatatan').innerHTML = `<span>${lomba.nama} | ${lomba.status.toUpperCase()}</span>`; } else { aksiDiv.style.display = 'none'; document.getElementById('infoCatatan').innerHTML = ''; }
    document.getElementById('catatanTable').innerHTML = (lomba?.catatan||[]).map(c=>{ const p=lomba.peserta.find(p=>p.noLapak===c.noLapak); return `<tr><td>${c.waktu}</td><td>${c.noLapak}</td><td>${p?p.nama:'?'}</td><td>${c.tipe==='super'?'🐟 SUPER':'🐠 RAMAI'}</td><td>${c.tipe==='super'?c.berat+' kg':c.jumlah+' ekor'}</td></tr>`; }).reverse().join('');
  }
  window.mulaiLomba = () => { const lomba = getLomba(document.getElementById('selCatat').value); if(!lomba || lomba.status!=='upcoming') return; if(!lomba.peserta.some(p=>p.noLapak)) { toast('Undi lapak dulu!'); return; } lomba.status='active'; lomba.actualStart=new Date().toLocaleString(); saveData(); renderCatatan(); toast('Lomba dimulai'); };
  window.selesaiLomba = () => { const lomba = getLomba(document.getElementById('selCatat').value); if(!lomba || lomba.status!=='active') return; lomba.status='completed'; lomba.actualEnd=new Date().toLocaleString(); saveData(); renderCatatan(); toast('Lomba selesai'); };
  window.catatSuper = () => { const lomba = getLomba(document.getElementById('selCatat').value); if(!lomba || lomba.status!=='active') return; const select = document.getElementById('fSuperPeserta'); select.innerHTML = '<option value="">-- Pilih --</option>'; (lomba.peserta||[]).filter(p=>p.noLapak).forEach(p=>{ const o=document.createElement('option'); o.value=p.noLapak; o.textContent=`Lapak ${p.noLapak} - ${p.nama}`; select.appendChild(o); }); showModal('modalSuper'); };
  window.simpanSuper = () => { const lomba = getLomba(document.getElementById('selCatat').value); if(!lomba) return; const no = parseInt(document.getElementById('fSuperPeserta').value); const berat = parseFloat(document.getElementById('fSuperBerat').value); if(!no||!berat) return; lomba.catatan.push({id:'cat_'+Date.now(), noLapak:no, tipe:'super', berat, waktu:new Date().toLocaleTimeString()}); saveData(); closeModal('modalSuper'); renderCatatan(); };
  window.catatRamai = () => { const lomba = getLomba(document.getElementById('selCatat').value); if(!lomba || lomba.status!=='active') return; isiPesertaGroup(); showModal('modalRamai'); };
  window.isiPesertaGroup = () => { const lomba = getLomba(document.getElementById('selCatat').value); if(!lomba) return; const grp = document.getElementById('fRamaiGroup').value; const select = document.getElementById('fRamaiPeserta'); select.innerHTML = '<option value="">-- Pilih --</option>'; (lomba.peserta||[]).filter(p=>p.noLapak && group(p.noLapak)===grp).forEach(p=>{ const o=document.createElement('option'); o.value=p.noLapak; o.textContent=`Lapak ${p.noLapak} - ${p.nama}`; select.appendChild(o); }); };
  window.simpanRamai = () => { const lomba = getLomba(document.getElementById('selCatat').value); if(!lomba) return; const no = parseInt(document.getElementById('fRamaiPeserta').value); const jumlah = parseInt(document.getElementById('fRamaiJumlah').value)||1; if(!no) return; lomba.catatan.push({id:'cat_'+Date.now(), noLapak:no, tipe:'ramai', jumlah, waktu:new Date().toLocaleTimeString()}); saveData(); closeModal('modalRamai'); renderCatatan(); };
  
  function hitungJuara(lomba) { const superFish = (lomba.catatan||[]).filter(c=>c.tipe==='super').sort((a,b)=>b.berat-a.berat); const winners=[]; const used=new Set(); for(const s of superFish) { if(winners.length>=lomba.jmlJuara) break; if(used.has(s.noLapak)) continue; const p=lomba.peserta.find(p=>p.noLapak===s.noLapak); winners.push({rank:winners.length+1, noLapak:s.noLapak, nama:p?.nama||'?', berat:s.berat, waktu:s.waktu}); used.add(s.noLapak); } const spotCount={}; superFish.forEach(s=>spotCount[s.noLapak]=(spotCount[s.noLapak]||0)+1); let induk=null, max=0; for(const [spot,cnt] of Object.entries(spotCount)) if(cnt>max) { max=cnt; const p=lomba.peserta.find(p=>p.noLapak===parseInt(spot)); induk={noLapak:parseInt(spot), nama:p?.nama||'?', count:cnt}; } const ramaiA=(lomba.catatan||[]).filter(c=>c.tipe==='ramai'&&group(c.noLapak)==='A').reduce((s,c)=>s+(c.jumlah||0),0); const ramaiB=(lomba.catatan||[]).filter(c=>c.tipe==='ramai'&&group(c.noLapak)==='B').reduce((s,c)=>s+(c.jumlah||0),0); return {winners,induk,ramaiA,ramaiB}; }
  function renderHasil() { const lomba = getLomba(document.getElementById('selHasil').value); const div = document.getElementById('hasilContent'); if(!lomba) { div.innerHTML=''; return; } const h = hitungJuara(lomba); div.innerHTML = `<div><h4>🏆 Juara Terberat</h4>${h.winners.map(w=>`<p>${w.rank}. Lapak ${w.noLapak} - ${w.nama} (${w.berat} kg)</p>`).join('')}<h4>👑 Total Induk Terbanyak</h4>${h.induk?`<p>Lapak ${h.induk.noLapak} - ${h.induk.nama} (${h.induk.count} ekor)</p>`:'-'}<h4>📊 Ramai</h4><p>A: ${h.ramaiA} | B: ${h.ramaiB}</p></div>`; }
  function renderTV() { const lomba = getLomba(document.getElementById('selTV').value); const container = document.getElementById('tvContainer'); if(!lomba) { container.innerHTML='<p>Pilih lomba</p>'; return; } const h = hitungJuara(lomba); const rows = h.winners.slice(0,4).map((w,i)=>`<tr style="${i===0?'background:#e8a81730':''}"><td>${w.rank}</td><td>${w.noLapak}</td><td>${w.nama}</td><td>${w.berat} kg</td><td>${w.waktu}</td></tr>`).join(''); container.innerHTML = `<div class="scoreboard"><h2>🏆 JUARA IKAN INDUK</h2><p>${lomba.nama} | ${lomba.tanggal}</p><table><thead><tr><th>#</th><th>Lapak</th><th>Nama</th><th>Berat</th><th>Waktu</th></tr></thead><tbody>${rows||'<tr><td colspan="5">Belum ada data</td></tr>'}</tbody></table></div>`; }
  window.resetAllData = () => { if(confirm('Hapus semua data?')) { data={lomba:[]}; saveData(); refreshAll(); toast('Data direset'); } };
  function refreshAll() { renderLomba(); ['selDaftar','selCatat','selHasil','selTV'].forEach(populateSelect); renderPeserta(); renderCatatan(); renderHasil(); renderTV(); }
  loadData(); refreshAll();
  setInterval(()=>{ if(document.getElementById('panel-papan').classList.contains('active')) renderTV(); }, 4000);
})();
</script>
</body>
</html>
